<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Covenant Attacking Map</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one printed sheet. The net seen from behind sits over the court seen from above,
     sharing one left-to-right axis. The call name shouts; everything around it stays quiet.
     Black, blue and red are reserved for the map's own color key. */
  --paper:#E9ECE6;
  --sheet:#F8F9F5;
  --court:#EDEFE8;
  --ink:#14161B;
  --ink-2:#555B65;
  --rule:#C3C8BE;
  --blue:#1E4AD0;
  --red:#CF2A1E;
  --purple:#7A3FC2;
  --green:#1B7F4B;
  --ball:#F2B90F;
  --ok:#197A45;
  --miss:#A85A06;
  --display:'Big Shoulders Display','Big Shoulders','Barlow Condensed','Arial Narrow',sans-serif;
  --cond:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--body)}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.app{max-width:1080px;margin:0 auto;padding:22px 20px 56px}

/* ---------- header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 24px;flex-wrap:wrap;padding-bottom:14px;border-bottom:3px solid var(--ink);margin-bottom:22px}
.eyebrow{font:600 12px/1.2 var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
h1{font:900 clamp(36px,8vw,54px)/.88 var(--display);text-transform:uppercase;margin:0;letter-spacing:.005em}
.tabs{display:flex;gap:4px}
.tabs button{font:700 17px/1 var(--cond);text-transform:uppercase;letter-spacing:.07em;padding:10px 14px;color:var(--ink);background:transparent;border:1.5px solid transparent;cursor:pointer}
.tabs button:hover{border-color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* ---------- board layout */
.board{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"stage top" "stage bottom";gap:22px 44px;align-items:start}
.ptop{grid-area:top;min-width:0}
.pbot{grid-area:bottom;min-width:0}
.stage-wrap{grid-area:stage;background:var(--sheet);border:1.5px solid var(--ink)}
@media (max-width:860px){
  .board{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;grid-template-areas:"top" "stage" "bottom";gap:16px}
  .stage-wrap{max-width:520px;width:100%;justify-self:center}
}

/* ---------- now showing */
.now{display:grid;gap:12px}
.now-name{font:900 clamp(60px,16vw,104px)/.8 var(--display);text-transform:uppercase;margin:0;letter-spacing:-.005em;overflow-wrap:anywhere}
.now-name.b{color:var(--blue)} .now-name.r{color:var(--red)} .now-name.p{color:var(--purple)} .now-name.g{color:var(--green)}
.now-name .alias{font-weight:600;font-size:.46em;color:var(--ink-2);margin-left:.22em;letter-spacing:.01em;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.tag{display:inline-flex;align-items:center;gap:7px;height:27px;padding:0 9px;border:1.5px solid var(--ink);font:600 13px/1 var(--cond);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.tag.who.k{background:var(--ink);color:var(--sheet)}
.tag.who.b{background:var(--blue);border-color:var(--blue);color:#fff}
.tag.who.r{background:var(--red);border-color:var(--red);color:#fff}
.tag.who.p{background:var(--purple);border-color:var(--purple);color:#fff}
.tag.who.g{background:var(--green);border-color:var(--green);color:#fff}
.tag.plain{border-color:var(--rule);color:var(--ink-2)}
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.bars i{width:3px;background:var(--rule)}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8.5px}.bars i:nth-child(3){height:12px}
.bars[data-n="1"] i:nth-child(-n+1),.bars[data-n="2"] i:nth-child(-n+2),.bars[data-n="3"] i{background:currentColor}
.cue{font:500 18px/1.35 var(--body);margin:0;max-width:34ch}
.seg{display:inline-flex;border:1.5px solid var(--ink)}
.seg button{border:0;background:transparent;font:700 14px/1 var(--cond);text-transform:uppercase;letter-spacing:.07em;padding:0 12px;height:32px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.segrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seglab{font:600 12px/1 var(--cond);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-2)}

/* ---------- stage */
#stage{display:block;width:100%;height:auto;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#stage text{font-family:var(--cond);font-weight:700}
#stage.c-k{--c:var(--ink)} #stage.c-b{--c:var(--blue)} #stage.c-r{--c:var(--red)}
#stage.c-p:not(.neutral){--c:var(--purple)} #stage.c-g:not(.neutral){--c:var(--green)}
#stage.neutral{--c:var(--ink-2)}
.cap{font-size:8px;font-weight:600!important;letter-spacing:.14em;fill:var(--ink-2)}
.tier{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 4}
.tierlab{font-size:8.5px;fill:var(--ink-2);letter-spacing:.05em}
.floor{stroke:var(--ink);stroke-width:1.5}
.meshl{fill:none;stroke:var(--ink);stroke-width:.5;opacity:.5}
.mesh{fill:url(#mesh)}
.tape{stroke:var(--ink);stroke-width:3}
.netb{stroke:var(--ink);stroke-width:1}
.ant{stroke:var(--ink);stroke-width:2;stroke-dasharray:3 2.5}
.post{stroke:var(--ink-2);stroke-width:3;stroke-linecap:round}
.sfig rect,.sfig circle{fill:var(--sheet);stroke:var(--ink);stroke-width:1.3}
.sfig line{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.opp{fill:var(--court);opacity:.45}
.court{fill:var(--court)}
.cl{stroke:var(--ink);stroke-width:1.6}
.cl.thin{stroke-width:1.2}
.netl{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.postdot{fill:var(--ink-2)}
.spot{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1}
.stok circle{fill:var(--sheet);stroke:var(--ink);stroke-width:1.5}
.stok text{fill:var(--ink);font-size:9px}
.fade0{stop-color:var(--sheet);stop-opacity:0}.fade1{stop-color:var(--sheet);stop-opacity:1}

.marker{cursor:pointer}
.marker.k{--k:var(--ink)}.marker.b{--k:var(--blue)}.marker.r{--k:var(--red)}.marker.p{--k:var(--purple)}
.marker .hitarea{fill:transparent}
.marker .dot{fill:var(--k)}
.marker .halo{fill:none;stroke:var(--k);stroke-width:1.5;display:none}
.marker.sel .halo{display:block}
.marker .mlab{fill:var(--k);font-size:11.5px;letter-spacing:.03em}
.br{cursor:pointer}
.br .hitarea{fill:transparent}
.br .pill{fill:var(--sheet);stroke:var(--green);stroke-width:1.3}
.br text{fill:var(--green);font-size:11px;letter-spacing:.04em}
.br.sel .pill{fill:var(--green);stroke:var(--green)}
.br.sel text{fill:#fff}

#route{fill:none;stroke:var(--ink-2);stroke-width:1.3;stroke-dasharray:4 4}
#air{stroke:var(--ink-2);stroke-width:1.4;stroke-dasharray:.5 3.5;stroke-linecap:round}
#setline{stroke:var(--c);stroke-width:1.4;stroke-dasharray:.5 4.5;stroke-linecap:round}
.foot ellipse{fill:var(--sheet);stroke:var(--ink-2);stroke-width:1.1}
.foot.on ellipse{fill:var(--rule)}
.foot.cue ellipse{fill:var(--c);stroke:var(--c)}
.footn{font-size:8px;fill:var(--ink-2)}
.footn.cue{fill:var(--c);font-size:10px}
#token circle{fill:var(--ink);stroke:var(--sheet);stroke-width:1.5}
#token text{fill:var(--sheet);font-size:8px;letter-spacing:.02em}
#bplan,#belev{fill:var(--ball);stroke:var(--ink);stroke-width:1.2}
#bshadow{fill:var(--ink);opacity:.15}
#arc{fill:none;stroke:var(--c);stroke-width:1.6;stroke-dasharray:.5 5;stroke-linecap:round}
#arcSolid{fill:none;stroke:var(--c);stroke-width:2.3}
.ring{fill:none;stroke:var(--ink);stroke-width:1.6}
.flash{fill:none;stroke:var(--c);stroke-width:2}
#efig rect,#efig circle{fill:var(--ink)}
#earm{stroke:var(--ink);stroke-width:3.2;stroke-linecap:round}

.tgt{display:none;cursor:pointer;outline:none}
#stage.show-targets .tgt,.tgt.right,.tgt.wrong{display:block}
#stage.show-targets.front-one .tgt[data-t="F1"],#stage.show-targets.front-one .tgt[data-t="F2"],
#stage.show-targets:not(.front-one) .tgt[data-t="F"]{display:none}
.tgt circle{fill:rgba(20,22,27,.05);stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}
.tgt:hover circle{fill:rgba(20,22,27,.13)}
.tgt:focus-visible circle{stroke:var(--blue);stroke-width:3;stroke-dasharray:none}
.tgt path{display:none;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tgt.right circle{stroke:var(--ok);fill:rgba(25,122,69,.16);stroke-dasharray:none;stroke-width:2.5}
.tgt.wrong circle{stroke:var(--miss);fill:rgba(168,90,6,.14);stroke-dasharray:none;stroke-width:2.5}
.tgt.right .tck{display:block;stroke:var(--ok)}
.tgt.wrong .tx{display:block;stroke:var(--miss)}
#msg{display:none}
#stage.show-msg #msg{display:block}
#msg .m1{font-size:15px;letter-spacing:.14em;fill:var(--ink-2)}
#msg .m2{font-size:11px;font-weight:600!important;letter-spacing:.06em;fill:var(--ink-2)}

#stage.hide-markers .marker,#stage.hide-br .br{display:none}
#stage.hide-route #route,#stage.hide-route #air,#stage.hide-route #setline{display:none}
#stage.hide-feet #feet{display:none}
#stage.hide-arc #arc,#stage.hide-arc #arcSolid{display:none}
#stage.hide-actor #token,#stage.hide-actor #efig,#stage.hide-actor #bplan,#stage.hide-actor #bshadow,#stage.hide-actor #belev,
#stage.hide-actor #sring,#stage.hide-actor #sringE,#stage.hide-actor #flashP,#stage.hide-actor #flashE{display:none}

/* ---------- transport */
.transport{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;align-items:center;padding:12px 14px 12px;border-top:1.5px solid var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;background:var(--ink);color:var(--sheet);border:1.5px solid var(--ink);font:800 21px/1 var(--display);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;white-space:nowrap}
.btn:hover{background:#2a2d35}
.btn:disabled{background:var(--rule);border-color:var(--rule);color:var(--sheet);cursor:default}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:rgba(20,22,27,.07)}
.btn svg{width:12px;height:12px;fill:currentColor}
.tl{position:relative;padding:15px 8px 17px}
.tl-track{position:relative;height:5px;background:var(--rule)}
.tl-fill{position:absolute;left:0;top:0;bottom:0;width:var(--p,0%);background:var(--ink)}
.tl-head{position:absolute;top:50%;left:var(--p,0%);width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:var(--ball);border:1.5px solid var(--ink)}
.tl input{position:absolute;left:-8px;width:calc(100% + 16px);top:-14px;height:33px;margin:0;opacity:0;cursor:pointer}
.tl input::-webkit-slider-thumb{width:16px;height:16px}
.tl input::-moz-range-thumb{width:16px;height:16px;border:0}
.tl:focus-within .tl-head{outline:2.5px solid var(--blue);outline-offset:2px}
.tl-flags,.tl-steps{position:absolute;left:8px;right:8px;height:13px;pointer-events:none}
.tl-flags{top:0}.tl-steps{bottom:0}
.tl-flags span,.tl-steps span{position:absolute;transform:translateX(-50%);font:700 10px/13px var(--cond);letter-spacing:.09em;white-space:nowrap}
.tl-flags span::after{content:"";position:absolute;left:50%;top:13px;width:1.5px;height:9px;background:var(--ink)}
.tl-steps span{color:var(--ink-2);font-weight:600}
.tl-steps span.cue{color:var(--ink);font-weight:700;border-bottom:2px solid var(--ink);line-height:11px}
.topts{grid-column:1/-1;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.check{display:inline-flex;align-items:center;gap:7px;font:600 14px/1 var(--cond);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.check input{width:17px;height:17px;margin:0;accent-color:var(--ink)}
.phase{margin-left:auto;font:600 13px/1 var(--cond);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2)}
.stage-wrap.quiz .tl,.stage-wrap.quiz .check,.stage-wrap.quiz .phase{display:none}
.stage-wrap.quiz .transport{grid-template-columns:auto auto;justify-content:start}
.stage-wrap.quiz .topts{grid-column:auto}

/* ---------- call list */
.calls{display:grid;gap:9px}
.cgroup{display:grid;grid-template-columns:108px minmax(0,1fr);gap:10px;align-items:start}
.cgroup h3,.legend h3{font:600 12px/1.2 var(--cond);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);margin:0}
.cgroup h3{padding-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 12px 0 10px;border:1.5px solid var(--ink);background:transparent;font:700 18px/1 var(--cond);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;white-space:nowrap}
.chip:hover{background:rgba(20,22,27,.07)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--ink);flex:none}
.chip.b .dot{background:var(--blue)}.chip.r .dot{background:var(--red)}.chip.p .dot{background:var(--purple)}
.chip.g .dot,.chip[aria-pressed="true"].g .dot{background:var(--green);border:0}
.chip .al{font-weight:500;color:var(--ink-2)}
.chip small{font:600 11px/1 var(--cond);letter-spacing:.06em;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.chip[aria-pressed="true"] .al,.chip[aria-pressed="true"] small{color:var(--rule)}
.chip[aria-pressed="true"].k .dot{background:var(--sheet)}
.legend{margin-top:22px;padding-top:16px;border-top:1.5px solid var(--ink);display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 28px}
.legend ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px;font-size:15px}
.key li{display:flex;align-items:center;gap:8px}
.sw{width:12px;height:12px;border-radius:50%;flex:none;background:var(--ink)}
.sw.b{background:var(--blue)}.sw.r{background:var(--red)}.sw.p{background:var(--purple)}.sw.g{background:var(--green)}
.key b{font:700 15px/1 var(--cond);text-transform:uppercase;letter-spacing:.06em;min-width:58px}
.notes li{padding-left:14px;position:relative}
.notes li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:1.5px;background:var(--ink)}
@media (max-width:480px){.cgroup{grid-template-columns:66px minmax(0,1fr);gap:8px}.chip{height:34px;font-size:16px;padding:0 8px 0 7px;gap:5px}.chip small{font-size:10px}.cgroup h3{padding-top:10px}}

/* ---------- quiz */
.qcard{display:grid;gap:12px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;font:600 12px/1.2 var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.qbar{height:5px;background:var(--rule)}
.qbar i{display:block;height:100%;background:var(--ink)}
.qcall{font:900 clamp(54px,14vw,92px)/.82 var(--display);text-transform:uppercase;margin:2px 0 0;overflow-wrap:anywhere}
.qcall .alias{font-weight:600;font-size:.46em;color:var(--ink-2);margin-left:.22em;white-space:nowrap}
.qsub{font:500 18px/1.3 var(--body);margin:0}
.qopts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
.opt{min-height:48px;padding:6px 10px;border:1.5px solid var(--ink);background:transparent;font:700 18px/1.05 var(--cond);text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.opt:hover:not(:disabled){background:rgba(20,22,27,.07)}
.opt:disabled{cursor:default;color:var(--ink-2);border-color:var(--rule)}
.opt.right:disabled{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong:disabled{border-color:var(--miss);color:var(--miss);text-decoration:line-through}
.qfb{min-height:74px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.qfb p{margin:0;font-size:16px;line-height:1.4;max-width:42ch}
.qfb b{font:800 21px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:4px}
.qfb b.ok{color:var(--ok)}.qfb b.no{color:var(--miss)}
.qtitle{font:900 clamp(40px,9vw,60px)/.88 var(--display);text-transform:uppercase;margin:0}
.qdesc{margin:0;font-size:17px;min-height:1.45em}
.qstartrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.best{font:600 13px/1 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.types{flex-wrap:wrap}
.score{font:900 clamp(84px,20vw,128px)/.8 var(--display);margin:0}
.score span{font-weight:600;font-size:.4em;color:var(--ink-2);margin-left:.15em}
.verdict{font:500 18px/1.35 var(--body);margin:0}
.misslist{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.misslist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.misslist button{border:0;background:none;padding:0;font:800 24px/1 var(--display);text-transform:uppercase;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.misslist button.b{color:var(--blue)}.misslist button.r{color:var(--red)}.misslist button.p{color:var(--purple)}.misslist button.g{color:var(--green)}
.misslist span{font-size:15px}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px;color:var(--ink-2)}
.link{border:0;background:none;padding:6px 0;font:600 14px/1 var(--cond);text-transform:uppercase;letter-spacing:.1em;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--ink)}

/* ---------- cheat sheet */
.sheet{display:grid;grid-template-columns:minmax(0,1fr);gap:34px}
.sheet>article{min-width:0}
.sheet h2{font:900 clamp(28px,5.6vw,38px)/.95 var(--display);text-transform:uppercase;margin:0 0 14px;text-wrap:balance;max-width:22ch}
.tempos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.tempos li{background:var(--sheet);border:1.5px solid var(--ink);padding:14px 14px 15px;display:grid;gap:10px;align-content:start}
.tempos .th{display:flex;align-items:center;flex-wrap:wrap;gap:6px 9px;font:700 18px/1 var(--cond);text-transform:uppercase;letter-spacing:.05em;min-height:36px;align-content:flex-start}
.tempos .th small{flex-basis:100%;font:600 12px/1 var(--cond);letter-spacing:.1em;color:var(--ink-2)}
table.even{table-layout:fixed}
table.even th,table.even td{width:20%}
.tempos p{margin:0;font-size:16px;line-height:1.35}
.minifeet{display:flex;align-items:flex-end;gap:9px;height:38px}
.minifeet i{display:grid;place-items:center;width:17px;height:28px;border-radius:50%;border:1.5px solid var(--ink-2);font:700 11px/1 var(--cond);font-style:normal;color:var(--ink-2)}
.minifeet i:nth-child(even){margin-bottom:9px}
.minifeet i.cue{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.minifeet em{font:600 11px/1.15 var(--cond);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-left:6px;align-self:center}
.tablewrap{overflow-x:auto;background:var(--sheet);border:1.5px solid var(--ink)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:11px 12px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--rule)}
tr:last-child th,tr:last-child td{border-bottom:0}
thead th{font:600 12px/1.2 var(--cond);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);border-bottom:1.5px solid var(--ink)}
tbody th{font:700 14px/1.1 var(--cond);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;width:1%}
td{font:800 25px/1 var(--display);text-transform:uppercase;letter-spacing:.01em}
td .al{font-weight:600;font-size:.62em;color:var(--ink-2)}
td .b,.sheet .b{color:var(--blue)} td .r,.sheet .r{color:var(--red)} td .p{color:var(--purple)} td .g{color:var(--green)}
td .sep{display:inline-block;width:.5em}
td.setter{font:600 11px/1.1 var(--cond);letter-spacing:.14em;color:var(--ink-2);text-align:center;border-left:1px dashed var(--ink-2);border-right:1px dashed var(--ink-2);width:1%;white-space:nowrap}
td.none{color:var(--rule)}
.sheetkey{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:10px 26px;font-size:16px}
.sheetkey li{display:flex;align-items:center;gap:8px}
.sheetkey b{font:700 16px/1 var(--cond);text-transform:uppercase;letter-spacing:.06em}
.fine{font-size:15px;color:var(--ink-2);margin:10px 0 0;max-width:65ch}

/* ---------- setter signals */
.sig{display:flex;gap:14px;align-items:center;border:1.5px solid var(--ink);background:var(--sheet);padding:8px 12px;max-width:380px}
.sig p{margin:4px 0 0;font-size:16px;line-height:1.3}
.sigfig{width:132px;flex:none}
.sigfig svg,.sigfig img,.qsig svg,.qsig img,.sigcard svg,.sigcard img{display:block;width:100%;height:auto}
.qsig{width:min(250px,72%);border:1.5px solid var(--ink);background:var(--sheet);padding:6px 10px}
.qsig img{max-width:190px;margin:0 auto}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.sigcard{background:var(--sheet);border:1.5px solid var(--ink);padding:10px 12px 12px;display:grid;gap:6px;align-content:start}
.sigcard b{font:800 24px/1 var(--display);text-transform:uppercase}
.sigcard b.b{color:var(--blue)}.sigcard b.r{color:var(--red)}.sigcard b.p{color:var(--purple)}.sigcard b.g{color:var(--green)}
.sigcard span{font-size:14px;line-height:1.3;color:var(--ink-2)}
.sigcard img{max-width:120px;margin:0 auto}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <p class="eyebrow">Covenant Christian · Boys Varsity</p>
      <h1>Attacking Map</h1>
    </div>
    <nav class="tabs" aria-label="Views">
      <button type="button" data-view="map" aria-current="page">Map</button>
      <button type="button" data-view="quiz">Quiz</button>
      <button type="button" data-view="sheet">Cheat sheet</button>
    </nav>
  </header>

  <main>
    <section id="board" class="board" aria-label="Playbook board">
      <div class="ptop">
        <div id="nowPanel" class="now"></div>
        <div id="quizPanel" class="qcard" hidden></div>
      </div>

      <div class="stage-wrap" id="stageWrap">
        <svg id="stage" role="group" aria-label="Diagram of the net from behind and the court from above, showing the selected set call"></svg>
        <div class="transport">
          <button type="button" class="btn" id="runBtn"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg><span>Run it</span></button>
          <div class="tl" id="tl">
            <div class="tl-flags" id="tlFlags" aria-hidden="true"></div>
            <div class="tl-track"><i class="tl-fill"></i><i class="tl-head"></i>
              <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Scrub through the play">
            </div>
            <div class="tl-steps" id="tlSteps" aria-hidden="true"></div>
          </div>
          <div class="topts">
            <div class="seg" role="group" aria-label="Playback speed">
              <button type="button" data-speed="1" id="sp1">Full speed</button>
              <button type="button" data-speed="0.4" id="sp2">Slow-mo</button>
            </div>
            <label class="check" for="holdChk"><input type="checkbox" id="holdChk"> Freeze at the setter's touch</label>
            <span class="phase" id="phase"></span>
          </div>
        </div>
      </div>

      <div class="pbot">
        <div id="callsPanel"></div>
        <div id="quizFoot" class="qfoot" hidden></div>
      </div>
    </section>

    <section id="sheet" class="sheet" hidden aria-label="Cheat sheet"></section>
  </main>
</div>

/* ================= geometry ================= */
const W = 400, S = 39, OX = 24.5, EV = 22, FLOOR = 182, NET_Y = 224, DEPTH = 7.3;
const H = Math.round(NET_Y + DEPTH * S + 4);
const X = m => OX + m * S, HY = h => FLOOR - h * EV, PY = d => NET_Y + d * S;
const SETTER = { x: 6.3, d: 0.55, h: 2.35 };
const TIER = { 1: 3.55, 2: 4.95, 3: 7.0 };

/* ================= timing (seconds, takeoff = 0) ================= */
const TS = [-1.05, -0.70, -0.32, -0.10];   // when each of the four steps plants
const FR = [0.15, 0.42, 0.80, 1];           // how far along the approach each step lands
const TSTART = -1.40, THIT = 0.28, TLAND = 0.62, TEND = 1.0, JUMP = 0.78;
const TSET = { q: -0.21, 2: -0.70, 3: -1.05 };
const APEX = { q: 3.45, 2: 4.95, 3: 7.0 };
const CUE_STEPS = { q: [2, 3], 2: [1], 3: [0] };

function routesFor(c) {
  const x = c.x;
  const OH = sx => ({ role: 'OH', label: 'Outside', s: [sx, 4.5], k: [x - 0.15, 1.1], h: [x, 0.6] });
  const MB = sx => ({ role: 'MB', label: 'Middle', s: [sx, 3.6], k: [x + (sx > x ? 0.12 : -0.12), 1.1], h: [x, 0.6] });
  switch (c.id) {
    case '4': case 'go': case 'shoot': return [OH(-0.3)];
    case '3': return [OH(0.0)];
    case 'rip': case 'gap': return [OH(0.0), MB(4.6)];
    case '2': return [OH(2.7), MB(4.7)];
    case 'push': return [MB(4.5)];
    case 'quick': return [MB(4.95)];
    case 'back1': return [MB(5.4), { role: 'RS', label: 'Right side', s: [8.9, 4.3], k: [7.05, 1.1], h: [x, 0.6] }];
    case 'wave': return [{ role: 'MB', label: 'Middle', s: [5.0, 3.5], c: [5.55, 1.2], k: [7.15, 1.2], h: [7.7, 0.7] }];
    case '5': case 'jet': case 'wide': return [{ role: 'RS', label: 'Right pin', s: [9.3, 4.5], k: [x + 0.15, 1.1], h: [x, 0.6] }];
    default: return [{ role: 'BR', label: 'Back row', s: [x, 5.9], k: [x, 3.35], h: [x, 2.3], back: true }];
  }
}

function makePlay(c, ri, vi) {
  const rs = routesFor(c), r = rs[ri] || rs[0];
  let tk = c.tk || '2', apex = null;
  if (c.id === 'bic') { if (vi === 1) { tk = '3'; apex = 6.0; } else { tk = '2'; } }
  if (apex == null) apex = APEX[tk];
  const tSet = TSET[tk], t0 = Math.min(TSTART, tSet - 1.0) - 0.25, t1 = TEND;
  const hitH = r.back ? 3.05 : 3.15;
  const ctrl = r.c || [(r.s[0] + r.k[0]) / 2, (r.s[1] + r.k[1]) / 2];
  const bez = u => { const a = 1 - u; return [a * a * r.s[0] + 2 * a * u * ctrl[0] + u * u * r.k[0], a * a * r.s[1] + 2 * a * u * ctrl[1] + u * u * r.k[1]]; };
  const tan = u => { const a = 1 - u; return [2 * a * (ctrl[0] - r.s[0]) + 2 * u * (r.k[0] - ctrl[0]), 2 * a * (ctrl[1] - r.s[1]) + 2 * u * (r.k[1] - ctrl[1])]; };
  const land = [r.h[0] + (r.h[0] - r.k[0]) * 0.4, Math.max(r.back ? 1.7 : 0.42, r.h[1] + (r.h[1] - r.k[1]) * 0.4)];
  const steps = FR.map((u, i) => {
    const p = bez(u), t = tan(u), len = Math.hypot(t[0], t[1]) || 1;
    const tx = t[0] / len, ty = t[1] / len, side = i % 2 === 0 ? 1 : -1;   // right, left, right, left
    return { x: p[0] + (-ty) * 0.13 * side, d: p[1] + tx * 0.13 * side, ang: Math.atan2(tx, -ty) * 180 / Math.PI, nx: -ty * side, ny: tx * side };
  });

  const frac = t => {
    if (t <= TSTART) return 0;

    for (let i = 0; i < 4; i++) if (t < kt[i + 1]) {

  const hitter = t => {
    if (t < 0) { const p = bez(frac(t)); return { x: p[0], d: p[1], j: 0, arm: 0 }; }
    const j = t < TLAND ? JUMP * 4 * (t / TLAND) * (1 - t / TLAND) : 0;
    if (t < THIT) { const u = t / THIT; return { x: lerp(r.k[0], r.h[0], u), d: lerp(r.k[1], r.h[1], u), j, arm: u }; }

    return { x: land[0], d: land[1], j: 0, arm: 0 };
  };
  const B = apex - (SETTER.h + hitH) / 2;
  const setH = u => SETTER.h + (hitH - SETTER.h) * u + 4 * B * u * (1 - u);
  const spikeDx = r.h[0] < 4.5 ? 1.3 : -1.3;
  const ball = t => {
    const tp = tSet - 1.0;
    if (t < tp) return null;
    if (t < tSet) { const u = t - tp; return { x: lerp(3.4, SETTER.x, u), d: lerp(7.9, SETTER.d, u), h: 0.8 + (SETTER.h - 0.8) * u + 11.6 * u * (1 - u), o: 1 }; }
    if (t <= THIT) { const u = (t - tSet) / (THIT - tSet); return { x: lerp(SETTER.x, r.h[0], u), d: lerp(SETTER.d, r.h[1], u), h: setH(u), o: 1 }; }
    const u = (t - THIT) / 0.32; if (u > 1) return null;
    return { x: r.h[0] + spikeDx * u, d: r.h[1] - (r.h[1] + 2.2) * u, h: hitH * (1 - u), o: 1 - u };
  };
  let arc = '';
  for (let i = 0; i <= 40; i++) { const u = i / 40; arc += (i ? 'L' : 'M') + f1(X(lerp(SETTER.x, r.h[0], u))) + ' ' + f1(HY(setH(u))); }
  return { c, r, tk, tSet, t0, t1, hitH, ctrl, land, steps, cue: CUE_STEPS[tk], hitter, ball, arc };
}

buildStage();
const el = id => document.getElementById(id);
const dom = {

/* ================= state ================= */
const state = { view: 'map', call: 'go', ri: 0, vi: 0, speed: store.get('ccam-speed', 1), hold: store.get('ccam-hold', true) };

function applyStageClass() {

function render() {

}

  else {
    const prev = T; T += real * state.speed;
    if ((state.hold || inQuestion()) && !held && prev < play.tSet && T >= play.tSet) { T = play.tSet; held = true; holdLeft = 0.85; }
    if (T >= play.t1) {
      T = play.t1; render(); playing = false;
      restTimer = setTimeout(() => { if (!playing) { T = play.tSet; render(); } }, 900);
      return;
    }
  }
  render();
  raf = requestAnimationFrame(tick);
}

/* ================= map panels ================= */
const bars = n => `<span class="bars" data-n="${n}" aria-hidden="true"><i></i><i></i><i></i></span>`;
function renderNow() {
  const c = byId[state.call], k = KEY[c.who], rs = routesFor(c);
  const v = c.id === 'bic' ? (state.vi === 1 ? 'pipe' : 'bic') : null;
  const tempo = v === 'bic' ? 2 : v === 'pipe' ? 3 : c.tempo;
  const cue = c.zone === 'BR' ? (v ? CUE_TXT[v] : CUE_TXT.back) : CUE_TXT[c.tk];
  const where = c.zone === 'BR' ? c.lane[0].toUpperCase() + c.lane.slice(1) : ZONE[c.zone].name;
  let h = `<p class="now-name ${k.cls}">${esc(c.name)}${c.alias ? `<span class="alias">/ ${esc(c.alias)}</span>` : ''}</p>
    <ul class="tags">
      ${tempo ? `<li class="tag">${bars(tempo)}${TEMPO_NAME[tempo]} tempo</li>` : ''}
      <li class="tag who ${k.cls}">${c.whoLabel || k.label}</li>
      <li class="tag plain">${esc(where)}</li>
    </ul>
    <p class="cue">${cue}</p>
    <div class="sig"><div class="sigfig">${sigFig(sigKey(c.id, state.vi))}</div><div><span class="seglab">Setter signal</span><p>${SIG[sigKey(c.id, state.vi)][2]}</p></div></div>`;
  if (rs.length > 1) h += `<div class="segrow"><span class="seglab">Run it as</span><div class="seg" role="group" aria-label="Who runs it">${rs.map((r, i) => `<button type="button" data-ri="${i}" aria-pressed="${i === state.ri}">${r.label}</button>`).join('')}</div></div>`;
  if (c.id === 'bic') h += `<div class="segrow"><span class="seglab">Show</span><div class="seg" role="group" aria-label="Bic or Pipe">${['Bic', 'Pipe'].map((n, i) => `<button type="button" data-vi="${i}" aria-pressed="${i === state.vi}">${n}</button>`).join('')}</div></div>`;
  el('nowPanel').innerHTML = h;
}
function renderCalls() {
  const chip = c => `<button type="button" class="chip ${KEY[c.who].cls}" data-id="${c.id}" aria-pressed="${c.id === state.call}"><i class="dot"></i>${esc(c.name)}${c.alias ? `<span class="al">/ ${esc(c.alias)}</span>` : ''}${c.tempo ? `<small>${TEMPO_ORD[c.tempo].toUpperCase()}</small>` : ''}</button>`;
  el('callsPanel').innerHTML = `<div class="calls">${ZONE_ORDER.map(z => `<div class="cgroup"><h3>${ZONE[z].name}</h3><div class="chips">${CALLS.filter(c => c.zone === z).map(chip).join('')}</div></div>`).join('')}</div>
    <div class="legend">
      <div><h3>Color key</h3><ul class="key"><li><i class="sw"></i><b>Black</b>Pin hitters: outside on the left, right side on the right</li><li><i class="sw b"></i><b>Blue</b>Outside or middle</li><li><i class="sw r"></i><b>Red</b>Middle only</li><li><i class="sw p"></i><b>Purple</b>Middle or right side</li><li><i class="sw g"></i><b>Green</b>Back row</li></ul></div>
      <div><h3>Reading the board</h3><ul class="notes"><li>Top view: the higher the dot, the higher the set peaks.</li><li>Filled footprints: where your feet are when the setter touches.</li><li>Drag the timeline to walk through a play.</li></ul></div>
    </div>`;
}
function syncChips() { $$('.chip').forEach(n => n.setAttribute('aria-pressed', String(n.dataset.id === state.call))); }
function selectCall(id, o = {}) {
  if (!byId[id]) return;
  if (state.call !== id) { state.ri = 0; state.vi = 0; }
  state.call = id;
  if (o.ri != null) state.ri = o.ri;
  if (o.vi != null) state.vi = o.vi;
  setPlay(); renderNow(); syncChips();
  if (o.play && !reduceMotion) run();
}

/* ================= quiz ================= */
const QTYPES = [
  ['mix', 'Mix', 'A bit of everything.'],
  ['where', 'Where', 'See the call, tap the spot on the court.'],
  ['tempo', 'Tempo', 'First, second or third.'],
  ['who', 'Who', 'Which hitters can run each call.'],
  ['feet', 'Feet', 'Where your feet are when the setter touches.'],
  ['read', 'Read it', 'Watch a play run with no labels and name the call.'],
  ['signal', 'Signals', 'See the setter signal, name the call.']
];
const QLABEL = Object.fromEntries(QTYPES.map(t => [t[0], t[1]]));
const POOL = {
  where: CALLS.map(c => c.id), read: CALLS.map(c => c.id), signal: CALLS.map(c => c.id),
  tempo: FRONT.map(c => c.id), who: FRONT.map(c => c.id),
  feet: FRONT.map(c => c.id)
};
const OPTS = {
  tempo: [[1, 'First'], [2, 'Second'], [3, 'Third']],
  who: [['oh', 'Outside only'], ['rs', 'Right side only'], ['pins', 'Pins only'], ['om', 'Outside or middle'], ['m', 'Middle only'], ['mr', 'Middle or right side']],
  feet: [['3', 'First step'], ['2', 'Second step'], ['q', 'Last two steps']]
};
const answerOf = q => { const c = byId[q.id]; return q.type === 'where' ? (c.zone === 'BR' ? c.id : c.spot || c.zone) : q.type === 'tempo' ? c.tempo : q.type === 'who' ? c.who : q.type === 'feet' ? c.tk : c.id; };
function distract(c) {
  const zi = ZONE_ORDER.indexOf(c.zone), twin = { push: 'quick', quick: 'push' }[c.id];
  return CALLS.filter(o => o.id !== c.id && o.id !== twin)
    .map(o => ({ id: o.id, s: (o.zone === c.zone ? 2 : 0) + (o.tk && o.tk === c.tk ? 1 : 0) + (Math.abs(ZONE_ORDER.indexOf(o.zone) - zi) === 1 && c.zone !== 'BR' && o.zone !== 'BR' ? 1 : 0) + Math.random() * 1.6 }))
    .sort((a, b) => b.s - a.s).slice(0, 3).map(o => o.id);
}
function mkQ(type, c) {
  const q = { type, id: c.id, ri: 0, vi: 0 };
  if (type === 'read' || type === 'signal') { q.ri = type === 'read' ? rnd(routesFor(c).length) : 0; if (c.id === 'bic') q.vi = rnd(2); q.opts = shuffle([c.id, ...distract(c)]); }
  return q;
}
function buildQs(type) {
  const types = type === 'mix' ? shuffle(['where', 'where', 'tempo', 'tempo', 'who', 'who', 'feet', 'read', 'read', 'signal']) : Array(10).fill(type);
  const used = new Set();
  return types.map(ty => {
    const pool = shuffle(POOL[ty]);
    const id = pool.find(i => !used.has(i)) || pool[0];
    used.add(id);
    return mkQ(ty, byId[id]);
  });
}
function explain(q) {
  const c = byId[q.id], n = full(c), back = c.zone === 'BR';
  const at = back ? `the back row, ${c.lane}` : c.at || ZONE[c.zone].at;
  switch (q.type) {
    case 'where': return `${n} gets hit at ${at}.`;
    case 'tempo': return `${n} is ${TEMPO_NAME[c.tempo].toLowerCase()} tempo. ${CUE_TXT[c.tk]}`;
    case 'who': return `${n} is ${KEY[c.who].color.toLowerCase()} on the map: ${KEY[c.who].label.toLowerCase()}.`;
    case 'feet': return `${n} is ${TEMPO_NAME[c.tempo].toLowerCase()} tempo. ${CUE_TXT[c.tk]}`;
    default: return `That was ${n}${c.tempo ? ', ' + TEMPO_NAME[c.tempo].toLowerCase() + ' tempo' : ''} at ${at}.`;
  }
}
function clearTargets() { $$('.tgt', svg).forEach(n => n.classList.remove('right', 'wrong')); }
function startRound(type, drill) {
  const qs = drill ? shuffle(drill).map(m => mkQ(m.type, byId[m.id])) : buildQs(type);
  round = { type: drill ? 'drill' : type, qs, i: 0, score: 0, streak: 0, answered: false, pick: null, ok: false, misses: [], done: false };
  showQuestion();
}
function showQuestion() {
  const q = round.qs[round.i];
  round.answered = false; round.pick = null;
  clearTargets(); flags.clear();
  ['neutral', 'hide-markers', 'hide-br', 'hide-route', 'hide-feet', 'hide-arc'].forEach(x => flags.add(x));
  if (q.type === 'where') { flags.add('hide-actor'); flags.add('show-targets'); if (q.id === '2') flags.add('front-one'); }
  else if (q.type !== 'read') { flags.add('hide-actor'); flags.add('show-msg'); }
  state.call = q.id; state.ri = q.ri; state.vi = q.vi;
  setPlay();
  renderQuiz();
  if (q.type === 'read' && !reduceMotion) setTimeout(() => { if (inQuestion() && !round.answered && round.qs[round.i] === q) run(); }, 450);
}
function answer(val) {
  if (!inQuestion() || round.answered) return;
  const q = round.qs[round.i], ans = answerOf(q);
  const okSet = [String(ans)];
  round.answered = true; round.pick = val; round.ok = okSet.includes(String(val));
  if (round.ok) { round.score++; round.streak++; } else { round.streak = 0; round.misses.push({ type: q.type, id: q.id }); }
  flags.clear(); setPlay();
  if (q.type === 'where') {
    $$('.tgt', svg).forEach(n => { if (round.ok ? n.dataset.t === String(val) : okSet.includes(n.dataset.t)) n.classList.add('right'); else if (n.dataset.t === String(val)) n.classList.add('wrong'); });
  }
  renderQuiz();
  const nb = $('#quizPanel [data-act="next"]'); if (nb) nb.focus({ preventScroll: true });
  if (!reduceMotion) run();
}
function nextQuestion() {
  if (!round || !round.answered) return;
  round.i++;
  if (round.i >= round.qs.length) {
    round.done = true;
    if (round.type !== 'drill') { const best = store.get('ccam-best', {}); if (!(best[round.type] >= round.score)) { best[round.type] = round.score; store.set('ccam-best', best); } }
    clearTargets(); flags.clear(); setPlay(); renderQuiz();
  } else showQuestion();
}
function renderQuiz() {
  const P = el('quizPanel'), F = el('quizFoot');
  const active = round && !round.done;
  dom.wrap.classList.toggle('quiz', !!active);
  dom.runBtn.querySelector('span').textContent = active ? 'Replay' : 'Run it';
  F.hidden = !active;
  if (!round) {
    const best = store.get('ccam-best', {}), d = QTYPES.find(t => t[0] === qType) || QTYPES[0];
    P.innerHTML = `<p class="eyebrow">Quiz</p>
      <h2 class="qtitle">Ten reps.<br>Know your calls cold.</h2>
      <div class="seg types" role="group" aria-label="What to drill">${QTYPES.map(t => `<button type="button" data-qtype="${t[0]}" aria-pressed="${t[0] === d[0]}">${t[1]}</button>`).join('')}</div>
      <p class="qdesc">${d[2]}</p>
      <div class="qstartrow"><button type="button" class="btn" data-act="start">Start</button>${best[d[0]] != null ? `<span class="best">Your best: ${best[d[0]]} / 10</span>` : ''}</div>`;
    dom.runBtn.disabled = false;
    return;
  }
  if (round.done) {
    const n = round.qs.length, s = round.score;
    const verdict = s === n ? 'Clean sheet. You know the map.' : s >= n * 0.8 ? 'Close. Clean up the misses below.' : s >= n * 0.5 ? 'Not there yet. Drill the misses, then run it back.' : 'Back to the map, then try again.';
    P.innerHTML = `<p class="eyebrow">${round.type === 'drill' ? 'Drill done' : 'Round done · ' + QLABEL[round.type]}</p>
      <p class="score">${s}<span>/ ${n}</span></p>
      <p class="verdict">${verdict}</p>
      ${round.misses.length ? `<ul class="misslist">${round.misses.map(m => { const c = byId[m.id]; return `<li><button type="button" class="${KEY[c.who].cls}" data-show="${c.id}" title="Show it on the board">${esc(full(c))}</button><span>${esc(explain(m))}</span></li>`; }).join('')}</ul>` : ''}
      <div class="qstartrow">${round.misses.length ? `<button type="button" class="btn" data-act="drill">Drill my misses</button>` : ''}<button type="button" class="btn ${round.misses.length ? 'ghost' : ''}" data-act="again">New round</button><button type="button" class="link" data-act="menu">Change drill</button></div>`;
    dom.runBtn.disabled = false;
    return;
  }
  const q = round.qs[round.i], c = byId[q.id], done = round.answered;
  dom.runBtn.disabled = !done && q.type !== 'read';
  const SUB = { where: 'Tap where it gets hit.', tempo: 'What tempo is it?', who: 'Who can run it?', feet: 'Where are your feet when the setter touches?', read: 'Watch the hitter and the ball.', signal: 'Which call is the setter showing?' };
  let h = `<div class="qmeta"><span>Question ${round.i + 1} of ${round.qs.length} · ${QLABEL[q.type]}</span><span>${round.streak > 1 ? 'Streak ' + round.streak : 'Score ' + round.score}</span></div>
    <div class="qbar" aria-hidden="true"><i style="width:${((round.i + (done ? 1 : 0)) / round.qs.length * 100).toFixed(0)}%"></i></div>
    ${q.type === 'signal' ? `<div class="qsig">${sigFig(sigKey(q.id, q.vi))}</div>` : ''}
    ${q.type === 'signal' && !done ? '' : `<h2 class="qcall">${q.type === 'read' && !done ? 'Which call?' : esc(c.name) + (c.alias ? `<span class="alias">/ ${esc(c.alias)}</span>` : '')}</h2>`}
    <p class="qsub">${SUB[q.type]}</p>`;
  if (q.type !== 'where') {
    const opts = q.opts ? q.opts.map(id => [id, full(byId[id])]) : OPTS[q.type];
    const ans = String(answerOf(q));
    h += `<div class="qopts">${opts.map(([v, l]) => `<button type="button" class="opt${done && String(v) === ans ? ' right' : done && String(v) === String(round.pick) ? ' wrong' : ''}" data-val="${v}"${done ? ' disabled' : ''}>${esc(l)}</button>`).join('')}</div>`;
  }
  h += `<div class="qfb" aria-live="polite">${done ? `<p><b class="${round.ok ? 'ok' : 'no'}">${round.ok ? 'Correct' : 'Miss'}</b>${esc(explain(q))}</p><button type="button" class="btn" data-act="next">${round.i + 1 >= round.qs.length ? 'Results' : 'Next'}</button>` : ''}</div>`;
  P.innerHTML = h;
  F.innerHTML = `<span>${round.type === 'drill' ? 'Drilling your misses' : QLABEL[round.type] + ' round'}</span><button type="button" class="link" data-act="quit">End round</button>`;
}

/* ================= cheat sheet ================= */
function renderSheet() {
  const nm = c => `<span class="${KEY[c.who].cls}">${esc(c.name)}${c.alias ? `<span class="al"> / ${esc(c.alias)}</span>` : ''}</span>`;
  const cell = (z, t) => { const cs = FRONT.filter(c => c.zone === z && c.tempo === t); return cs.length ? `<td>${cs.map(nm).join('<span class="sep"></span>')}</td>` : `<td class="none">–</td>`; };
  const feet = (cue, note) => `<div class="minifeet">${[0, 1, 2, 3].map(i => `<i class="${cue.includes(i) ? 'cue' : ''}">${i + 1}</i>`).join('')}${note ? `<em>${note}</em>` : ''}</div>`;
  const setterCell = t => t === 3 ? `<td class="setter" rowspan="3">SETTER</td>` : '';
  el('sheet').innerHTML = `
    <article>
      <h2>Tempo is where your feet are when the setter touches</h2>
      <ul class="tempos">
        <li><div class="th">${bars(1)}First tempo</div>${feet([2, 3])}<p>On the last two steps of your approach.</p></li>
        <li><div class="th">${bars(2)}Second tempo</div>${feet([1])}<p>On the second step of your approach.</p></li>
        <li><div class="th">${bars(3)}Third tempo</div>${feet([0], 'High ball')}<p>On the first step of your approach.</p></li>
      </ul>
    </article>
    <article>
      <h2>Front row, left to right along the net</h2>
      <div class="tablewrap"><table>
        <thead><tr><th scope="col">Tempo</th><th scope="col">Left pin</th><th scope="col">Zone 3</th><th scope="col">Front of setter</th><th scope="col"><span hidden>Setter</span></th><th scope="col">Behind setter</th><th scope="col">Right pin</th></tr></thead>
        <tbody>${[3, 2, 1].map(t => `<tr><th scope="row">${TEMPO_NAME[t]}</th>${cell('L', t)}${cell('Z3', t)}${cell('F', t)}${setterCell(t)}${cell('B', t)}${cell('R', t)}</tr>`).join('')}</tbody>
      </table></div>
      <ul class="sheetkey" style="margin-top:14px"><li><i class="sw"></i><b>Black</b>Pin hitters: outside on the left, right side on the right</li><li><i class="sw b"></i><b>Blue</b>Outside or middle</li><li><i class="sw r"></i><b>Red</b>Middle only</li><li><i class="sw p"></i><b>Purple</b>Middle or right side</li><li><i class="sw g"></i><b>Green</b>Back row</li></ul>
    </article>
    <article>
      <h2>Back row, left to right</h2>
      <div class="tablewrap"><table class="even">
        <thead><tr>${BACK.map(c => `<th scope="col">${c.lane}</th>`).join('')}</tr></thead>
        <tbody><tr>${BACK.map(c => `<td><span class="g">${esc(c.name)}</span>${c.alias ? `<span class="al"> / ${esc(c.alias)}</span>` : ''}</td>`).join('')}</tr></tbody>
      </table></div>
      <p class="fine">Bic and Pipe share the middle-back lane. Bic is second tempo, Pipe is third.</p>
    </article>
    <article>
      <h2>Setter signals</h2>
      <p class="fine" style="margin:0 0 12px">Front-row signals are shown with the hand sideways. Lanes A to D point the fingers down.</p>
      <div class="sigs">${CALLS.flatMap(c => c.id === 'bic' ? [[c, 'bic', 'Bic'], [c, 'pipe', 'Pipe']] : [[c, c.id, full(c)]]).map(([c, k, n]) => `<div class="sigcard"><b class="${KEY[c.who].cls}">${esc(n)}</b>${sigFig(k)}<span>${SIG[k][2]}</span></div>`).join('')}</div>
    </article>`;
}

/* ================= views ================= */
function setView(v) {
  if (!['map', 'quiz', 'sheet'].includes(v)) v = 'map';
  state.view = v;
  $$('.tabs button').forEach(btn => {
    if (btn.dataset.view === v) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  });
  el('board').hidden = v === 'sheet';
  el('sheet').hidden = v !== 'sheet';
  el('nowPanel').hidden = el('callsPanel').hidden = v !== 'map';
  el('quizPanel').hidden = v !== 'quiz';
  stop();
  if (v === 'map') {
    clearTargets(); flags.clear();
    dom.wrap.classList.remove('quiz'); dom.runBtn.disabled = false; dom.runBtn.querySelector('span').textContent = 'Run it';
    el('quizFoot').hidden = true;
    setPlay(); renderNow(); syncChips();
  } else if (v === 'quiz') {
    if (round && !round.done) { if (round.answered) { flags.clear(); setPlay(); renderQuiz(); } else showQuestion(); }
    else { flags.clear(); setPlay(); renderQuiz(); }
  }
}

/* ================= events ================= */
$$('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => setView(btn.dataset.view));
});
svg.addEventListener('click', e => {
  const t = e.target.closest('.tgt');
  if (t) { answer(t.dataset.t); return; }
  const m = e.target.closest('.marker,.br');
  if (m && !inQuestion()) selectCall(m.dataset.id, { play: true });
});
svg.addEventListener('keydown', e => {
  const t = e.target.closest && e.target.closest('.tgt');
  if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); answer(t.dataset.t); }
});
el('callsPanel').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) selectCall(b.dataset.id, { play: true }); });
el('nowPanel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.ri != null) selectCall(state.call, { ri: +b.dataset.ri, play: true });
  else if (b.dataset.vi != null) selectCall(state.call, { vi: +b.dataset.vi, play: true });
});
el('quizPanel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.qtype) { qType = b.dataset.qtype; store.set('ccam-qtype', qType); renderQuiz(); const n = $(`#quizPanel [data-qtype="${qType}"]`); if (n) n.focus({ preventScroll: true }); }
  else if (b.dataset.val != null) answer(b.dataset.val);
  else if (b.dataset.show) { selectCall(b.dataset.show, { play: true }); }
  else if (b.dataset.act === 'start' || b.dataset.act === 'again') startRound(round && round.type !== 'drill' && b.dataset.act === 'again' ? round.type : qType);
  else if (b.dataset.act === 'drill') startRound(null, round.misses);
  else if (b.dataset.act === 'next') nextQuestion();
  else if (b.dataset.act === 'menu') { round = null; renderQuiz(); }
});
el('quizFoot').addEventListener('click', e => {
  if (e.target.closest('[data-act="quit"]')) { round = null; stop(); clearTargets(); flags.clear(); setPlay(); renderQuiz(); }
});
dom.runBtn.addEventListener('click', () => run());
dom.scrub.addEventListener('input', () => { stop(); T = lerp(play.t0, play.t1, dom.scrub.value / 1000); render(); });
function syncOpts() {
  el('sp1').setAttribute('aria-pressed', String(state.speed === 1));
  el('sp2').setAttribute('aria-pressed', String(state.speed !== 1));
  el('holdChk').checked = !!state.hold;
}
$$('[data-speed]').forEach(b => b.addEventListener('click', () => { state.speed = +b.dataset.speed; store.set('ccam-speed', state.speed); syncOpts(); }));
el('holdChk').addEventListener('change', e => { state.hold = e.target.checked; store.set('ccam-hold', state.hold); });

/* ================= boot ================= */
renderCalls();
renderSheet();
syncOpts();
setView('map');
})();
</script>
